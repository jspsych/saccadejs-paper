project:
  type: default
  output-dir: _output
  render:
    - paper.qmd

filters:
  - filters/table-notes.lua

execute:
  echo: false
  warning: false
  message: false

format:
  preprint-typst:
    papersize: us-letter
    margin:
      x: 1in
      y: 1in
    section-numbering: "1.1"
    # Tables in a slightly smaller type, left-aligned and wrapping at spaces rather than mid-word,
    # so headers like "Per person" break between the words.
    include-in-header:
      text: |
        #show table: set text(size: 9pt, hyphenate: false)
        #show table: set par(justify: false)
