name: Render paper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::readr
            any::jsonlite
            any::ggplot2
            any::dplyr
            any::tidyr
            any::purrr
            any::tibble
            any::scales
            any::patchwork
            any::forcats
            any::magick

      # The validation dataset (Zenodo record 23213276, ~400 MB). The key carries the archive's
      # MD5, so a new upload (with a new MD5 in R/data.R) misses the cache and downloads again.
      - name: Restore dataset from cache
        uses: actions/cache@v6
        with:
          path: data/saccadejs-validation
          key: zenodo-23213276-6ecdcb53c34748d6ec53ecd27a2e2f3d

      # The model evaluation dataset (~255 MB), a second file in the same record, cached the same way.
      - name: Restore evaluation dataset from cache
        uses: actions/cache@v6
        with:
          path: data/saccadejs-eval
          key: zenodo-23213276-eval-5ba002707937c99ff9a6b2d25e9c72f1

      # The dataset summary (~450 KB), a third file in the same record.
      - name: Restore dataset summary from cache
        uses: actions/cache@v6
        with:
          path: data/saccadejs-dataset-summary
          key: zenodo-23213276-summary-333454a8416739489bca465fb8ab99b3

      # knitr's chunk cache, so a push that leaves the replays' code and data alone skips them.
      # The key changes with the paper and R code, so each such push saves a new cache; on a
      # miss, restore-keys loads the latest one and knitr reruns only the chunks whose code or
      # cache.extra changed. knitr doesn't track package versions: if an update changes results,
      # delete the cache under the repo's Actions > Caches.
      - name: Restore knitr cache
        uses: actions/cache@v6
        with:
          path: paper_cache
          key: knitr-${{ hashFiles('paper.qmd', 'R/**') }}
          restore-keys: knitr-

      - name: Render PDF
        env:
          # Needed only while the Zenodo record is an unpublished draft.
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: quarto render

      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest _output/paper.pdf \
            --title "Latest render" \
            --notes "Rendered from ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" \
            --prerelease
