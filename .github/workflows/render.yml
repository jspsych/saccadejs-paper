name: Render paper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::readr
            any::jsonlite
            any::ggplot2
            any::dplyr
            any::tidyr
            any::purrr
            any::tibble
            any::scales
            any::patchwork
            any::forcats
            any::magick

      # The validation dataset (Zenodo record 23213276, ~400 MB). The key carries the archive's
      # MD5, so a new upload (with a new MD5 in R/data.R) misses the cache and downloads again.
      - name: Restore dataset from cache
        uses: actions/cache@v6
        with:
          path: data/saccadejs-validation
          key: zenodo-23213276-6ecdcb53c34748d6ec53ecd27a2e2f3d

      # The model evaluation dataset (~245 MB), a second file in the same record, cached the same way.
      - name: Restore evaluation dataset from cache
        uses: actions/cache@v6
        with:
          path: data/saccadejs-eval
          key: zenodo-23213276-eval-a90fa7c46c9631cf28b4fd3f5ab29bc5

      - name: Render PDF
        env:
          # Needed only while the Zenodo record is an unpublished draft.
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: quarto render

      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest _output/paper.pdf \
            --title "Latest render" \
            --notes "Rendered from ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" \
            --prerelease
